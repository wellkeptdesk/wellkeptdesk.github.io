<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Weather · WellKeptDesk</title>
<style>
  :root { --ink: #4B4561; --muted: #8A847C; --line: #9B93B3; --warm: #C9A98A; --tile: #F1EEF5; }
  @media (prefers-color-scheme: dark) { :root { --ink: #E9E5F2; --muted: #A19B93; --line: #9A92B6; --warm: #D6B596; --tile: #2B2935; } }
  html[data-theme="light"] { --ink:#4B4561; --muted:#8A847C; --line:#9B93B3; --warm:#C9A98A; --tile:#F1EEF5; }
  html[data-theme="dark"]  { --ink:#E9E5F2; --muted:#A19B93; --line:#9A92B6; --warm:#D6B596; --tile:#2B2935; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: ui-sans-serif, -apple-system, "Segoe UI Variable Display", "Segoe UI", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { height: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 2px; opacity: 0; transition: opacity .5s; }
  .wrap.on { opacity: 1; }
  .ico { flex: none; width: 56px; height: 56px; border-radius: 16px; background: var(--tile); display: grid; place-items: center; }
  .ico svg { width: 36px; height: 36px; fill: none; stroke: var(--line); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .ico .w { stroke: var(--warm); }
  .col { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
  .temp { color: var(--ink); font-size: 30px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .temp small { font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 1px; }
  .city { color: var(--ink); font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .meta { color: var(--muted); font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
</style>
</head>
<body>
<div class="wrap" id="w">
  <div class="ico" id="ico"></div>
  <div class="col"><div class="temp" id="t">--</div><div class="city" id="c">&nbsp;</div><div class="meta" id="m">&nbsp;</div></div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var th = q.get('theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
  var imperial = (q.get('unit') || '').toLowerCase() === 'f';
  var $ = function (id) { return document.getElementById(id); };
  // Hand-drawn line icons (original shapes), 36px grid.
  var S = {
    sun: '<circle class="w" cx="18" cy="18" r="6"/><path class="w" d="M18 4v3M18 29v3M4 18h3M29 18h3M8.1 8.1l2.1 2.1M25.8 25.8l2.1 2.1M27.9 8.1l-2.1 2.1M10.2 25.8l-2.1 2.1"/>',
    moon: '<path d="M26 22.5A10 10 0 0 1 13.5 10 10 10 0 1 0 26 22.5z"/>',
    cloud: '<path d="M10 26h15a6 6 0 0 0 .6-12 8 8 0 0 0-15.3 2A5.1 5.1 0 0 0 10 26z"/>',
    part: '<circle class="w" cx="13" cy="12" r="4.2"/><path class="w" d="M13 3.5v2M4.5 12h2M6.9 5.9l1.4 1.4M19.1 5.9l-1.4 1.4"/><path d="M12 28h14a5 5 0 0 0 .5-10 7 7 0 0 0-13.4 1.6A4.2 4.2 0 0 0 12 28z"/>',
    rain: '<path d="M10 21h15a5.5 5.5 0 0 0 .5-11 7.5 7.5 0 0 0-14.4 1.8A4.6 4.6 0 0 0 10 21z"/><path d="M12 25l-1.5 4M18 25l-1.5 4M24 25l-1.5 4"/>',
    snow: '<path d="M10 21h15a5.5 5.5 0 0 0 .5-11 7.5 7.5 0 0 0-14.4 1.8A4.6 4.6 0 0 0 10 21z"/><path d="M12 26h.01M18 28h.01M24 26h.01M15 30h.01M21 30h.01" stroke-width="2.6"/>',
    storm: '<path d="M10 20h15a5.5 5.5 0 0 0 .5-11 7.5 7.5 0 0 0-14.4 1.8A4.6 4.6 0 0 0 10 20z"/><path class="w" d="M19 22l-4 5h5l-3 5"/>',
    fog: '<path d="M10 17h15a5 5 0 0 0 .5-10 7 7 0 0 0-13.4 1.6A4.2 4.2 0 0 0 10 17z"/><path d="M8 22h20M11 27h14"/>'
  };
  function kind(c, day) {
    if (c === 0) return day ? 'sun' : 'moon';
    if (c <= 2) return day ? 'part' : 'cloud';
    if (c === 3) return 'cloud';
    if (c === 45 || c === 48) return 'fog';
    if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) return 'rain';
    if ((c >= 71 && c <= 77) || c === 85 || c === 86) return 'snow';
    if (c >= 95) return 'storm';
    return 'cloud';
  }
  var WORDS = { sun: 'Clear', moon: 'Clear night', part: 'Partly cloudy', cloud: 'Cloudy', fog: 'Foggy', rain: 'Rain', snow: 'Snow', storm: 'Thunderstorm' };
  function deg(c) { return Math.round(imperial ? c * 9 / 5 + 32 : c); }
  function show(city, d) {
    var k = kind(d.current.weather_code, d.current.is_day === 1);
    $('ico').innerHTML = '<svg viewBox="0 0 36 36" aria-hidden="true">' + S[k] + '</svg>';
    $('t').innerHTML = deg(d.current.temperature_2m) + '<small>°' + (imperial ? 'F' : 'C') + '</small>';
    $('c').textContent = city;
    $('m').textContent = WORDS[k] + ' · H ' + deg(d.daily.temperature_2m_max[0]) + '° L ' + deg(d.daily.temperature_2m_min[0]) + '°';
    $('w').classList.add('on');
  }
  function fail(msg) { $('ico').innerHTML = '<svg viewBox="0 0 36 36">' + S.cloud + '</svg>'; $('c').textContent = msg; $('t').textContent = '--'; $('w').classList.add('on'); }
  function guessCity() {
    try { var z = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; var n = z.split('/').pop().replace(/_/g, ' '); if (n && n !== 'UTC') return n; } catch (e) {}
    return 'London';
  }
  var city = (q.get('city') || '').trim() || guessCity();
  function forecast(lat, lon, label) {
    var u = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
      '&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=auto';
    return fetch(u).then(function (r) { return r.json(); }).then(function (d) { show(label, d); });
  }
  function run() {
    fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&name=' + encodeURIComponent(city))
      .then(function (r) { return r.json(); })
      .then(function (g) {
        if (!g.results || !g.results.length) return fail('City not found');
        var r = g.results[0];
        return forecast(r.latitude, r.longitude, r.name);
      }).catch(function () { fail('Offline'); });
  }
  run(); setInterval(run, 15 * 60 * 1000);
})();
</script>
</body>
</html>
