<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Water · Aero · WellKeptDesk</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<style>
@font-face{font-family:"Open Sans";src:url(../fonts/open-sans-latin-300-normal.woff2) format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"Open Sans";src:url(../fonts/open-sans-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Open Sans";src:url(../fonts/open-sans-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Open Sans";src:url(../fonts/open-sans-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
/* Aero water widget. Class B: local interactive (data stays in this browser, no Notion connection).
   Tokens come from the measured Frutiger Aero palette study (DI 8.0, COLOR_INTELLIGENCE/PALETTE_LIBRARY/frutiger-aero.md). */
:root{
  --canvas:#07183A; --surface:#0B2654; --elev:#0B376A; --sky5:#3186E9; --sky7:#194CB1; --glow:#71E3FE;
  --grass5:#81D943; --grass7:#449D2E; --lime:#CFF846; --text:#EFF6FB; --text2:#9BBCD5; --rim:rgba(255,255,255,.22);
}
:root[data-theme="aqua"]{
  --canvas:#E3F6F6; --surface:#B8E9E8; --elev:#FFFFFF; --sky5:#14BBC2; --sky7:#00717A; --glow:#14BBC2;
  --grass5:#43DAB0; --grass7:#11846E; --lime:#93F7C3; --text:#03343C; --text2:#3F6C71; --rim:rgba(0,113,122,.25);
}
:root[data-theme="day"]{
  --canvas:#F0F8FC; --surface:#DAEFF8; --elev:#FFFFFF; --sky5:#4FA6E9; --sky7:#0E5CAF; --glow:#4FA6E9;
  --grass5:#7FD146; --grass7:#307C1B; --lime:#CFEF46; --text:#122334; --text2:#43586A; --rim:rgba(14,92,175,.25);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent}
body{font-family:"Open Sans","Segoe UI",system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
.card{position:relative;height:100%;min-height:0;border-radius:18px;overflow:hidden;
  background:linear-gradient(180deg,var(--surface) 0%,var(--canvas) 100%);
  border:1px solid var(--rim);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28);
  display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;padding:18px 22px;container-type:inline-size}
/* light swoosh: the period's signature background light, kept behind content and low opacity */
.card::before{content:"";position:absolute;inset:-40% -10% auto -10%;height:120%;
  background:radial-gradient(60% 30% at 70% 55%,color-mix(in oklch,var(--glow) 35%,transparent),transparent 70%);pointer-events:none}
.orb{position:relative;width:132px;height:132px;flex:none;border-radius:50%;
  background:radial-gradient(circle at 50% 120%,color-mix(in oklch,var(--sky7) 60%,var(--canvas)),var(--canvas) 70%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),inset 0 -10px 24px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.25);overflow:hidden}
.orb svg{position:absolute;inset:0;width:100%;height:100%}
.orb .shine{position:absolute;left:20%;top:6%;width:52%;height:26%;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0) 90%);pointer-events:none}
.orb .dot{position:absolute;left:22%;top:20%;width:7%;height:7%;border-radius:50%;background:#fff;opacity:.9}
.wave{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:no-preference){ .wavepath{animation:drift 6s linear infinite} }
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.info{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text2)}
.count{font-weight:300;font-size:46px;line-height:1;letter-spacing:-.02em}
.count b{font-weight:600}
.count small{font-size:18px;font-weight:400;color:var(--text2);letter-spacing:0}
.note{font-size:13px;color:var(--text2);min-height:1.2em}
.row{display:flex;gap:8px;align-items:center;margin-top:4px}
button{font:600 13px/1 "Open Sans",system-ui,sans-serif;border-radius:999px;padding:9px 16px;cursor:pointer;color:#FCFCFC;
  border:1px solid rgba(255,255,255,.35);
  background:linear-gradient(180deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,.08) 50%,transparent 51%),var(--sky7);
  box-shadow:0 2px 6px rgba(0,0,0,.25)}
button.minus{background:linear-gradient(180deg,rgba(255,255,255,.3) 0%,rgba(255,255,255,.05) 50%,transparent 51%),color-mix(in oklch,var(--sky7) 35%,var(--canvas));padding:9px 13px}
button:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
button:active{transform:translateY(1px)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:46px;margin-top:6px;position:relative}
.week .bar{position:relative;border-radius:5px 5px 2px 2px;background:color-mix(in oklch,var(--sky5) 30%,transparent);min-height:3px}
.week .bar.hit{background:linear-gradient(180deg,var(--grass5),var(--grass7))}
.week .bar.today{outline:1.5px solid var(--text);outline-offset:1px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:10px;color:var(--text2);text-align:center}
.goal{position:absolute;left:0;right:0;border-top:1px dashed var(--text2);opacity:.7}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-height:235px){ .card{padding:12px 18px;gap:16px} .count{font-size:38px} .week{height:30px;margin-top:2px} .info{gap:4px} .orb{width:112px;height:112px} }
@media (max-height:190px){ .week,.days{display:none} }
@container (max-width:340px){ .card{grid-template-columns:1fr;justify-items:center;text-align:center} .row{justify-content:center} .orb{width:96px;height:96px} .count{font-size:38px} }
</style>
</head>
<body>
<div class="card" role="group" aria-labelledby="t">
  <div class="orb" aria-hidden="true">
    <svg viewBox="0 0 200 200" preserveAspectRatio="none"><defs>
      <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--glow)"/><stop offset="1" stop-color="var(--sky7)"/></linearGradient></defs>
      <g class="wave" id="wave"><g class="wavepath">
        <path d="M0 10 Q 25 0 50 10 T 100 10 T 150 10 T 200 10 T 250 10 T 300 10 T 350 10 T 400 10 V 400 H 0 Z" fill="url(#wg)" opacity=".92"/>
      </g></g></svg>
    <div class="shine"></div><div class="dot"></div>
  </div>
  <div class="info">
    <div class="eyebrow" id="t">Water today</div>
    <div class="count" aria-live="polite"><b id="n">0</b><small> / <span id="g">8</span> glasses</small></div>
    <div class="note" id="note"></div>
    <div class="row">
      <button class="minus" id="minus" aria-label="Remove one glass">−</button>
      <button id="plus" aria-label="Add one glass">+ Glass</button>
    </div>
    <div class="week" id="week" aria-hidden="true"><div class="goal" id="goal"></div></div>
    <div class="days" id="days" aria-hidden="true"></div>
    <p class="sr" id="weeksr"></p>
  </div>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var theme=({day:'day',light:'day',aqua:'aqua'})[q.get('theme')]||'night'; document.documentElement.dataset.theme=theme;
  var goal=Math.max(1,Math.min(20,parseInt(q.get('goal')||'8',10)||8)); document.getElementById('g').textContent=goal;
  var KEY='aero-water-v1', store={}, ok=true;
  try{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){ok=false;store={}}
  function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  var demo=q.get('demo')==='1';
  function save(){if(!ok||demo)return;try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){ok=false}}
  var today=dkey(new Date());
  function render(){
    var n=store[today]||0; document.getElementById('n').textContent=n;
    var frac=Math.min(1,n/goal); document.getElementById('wave').style.transform='translateY('+(200-frac*190-6)+'px)';
    var note=document.getElementById('note');
    note.textContent=!ok?'Not saved: this browser blocks storage in embeds.':(n===0?'First glass of the day?':(n>=goal?'Goal reached. Nice.':(goal-n)+' to go'));
    var wk=document.getElementById('week'),dy=document.getElementById('days');
    wk.querySelectorAll('.bar').forEach(function(b){b.remove()}); dy.innerHTML='';
    var max=Math.max(goal,1),sr=[];
    for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=dkey(d),v=store[k]||0;
      var b=document.createElement('div');b.className='bar'+(v>=goal?' hit':'')+(i===0?' today':'');b.style.height=Math.max(3,Math.min(1,v/max)*100)+'%';wk.appendChild(b);
      var l=document.createElement('div');l.textContent='SMTWTFS'[d.getDay()];dy.appendChild(l);sr.push(k+': '+v)}
    document.getElementById('goal').style.bottom='100%';
    document.getElementById('weeksr').textContent='Last seven days: '+sr.join(', ');
  }
  document.getElementById('plus').onclick=function(){store[today]=Math.min(30,(store[today]||0)+1);save();render()};
  document.getElementById('minus').onclick=function(){store[today]=Math.max(0,(store[today]||0)-1);save();render()};
  if(demo){store={};var s=[6,8,5,9,8,4,5];for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);store[dkey(d)]=s[6-i]}}
  render();
})();
</script>
</body>
</html>
