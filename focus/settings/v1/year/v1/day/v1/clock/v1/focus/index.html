<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Focus timer · WellKeptDesk</title>
<style>
  :root { --ink: #2F3332; --muted: #7C8279; --line: #6B8071; --track: #E7E5DF; --tile: #F4F2EE; --btn: #2F3332; --btnt: #fff; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ECEBE6; --muted: #A3A89F; --line: #9DAE9F; --track: #3A3F3C; --tile: #2A2E2C; --btn: #ECEBE6; --btnt: #222624; } }
  html[data-theme="light"] { --ink:#2F3332; --muted:#7C8279; --line:#6B8071; --track:#E7E5DF; --tile:#F4F2EE; --btn:#2F3332; --btnt:#fff; }
  html[data-theme="dark"]  { --ink:#ECEBE6; --muted:#A3A89F; --line:#9DAE9F; --track:#3A3F3C; --tile:#2A2E2C; --btn:#ECEBE6; --btnt:#222624; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: ui-sans-serif, -apple-system, "Segoe UI Variable Display", "Segoe UI", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { height: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 2px; }
  .arch { flex: none; width: 52px; height: 72px; }
  .arch path { fill: none; stroke-width: 5; stroke-linecap: round; }
  .arch .tr { stroke: var(--track); } .arch .fg { stroke: var(--line); }
  .col { display: flex; flex-direction: column; min-width: 0; }
  .big { color: var(--ink); font-size: 32px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .l { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin: 3px 0 7px; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  @media (max-width: 170px) { .arch { width: 36px; height: 50px; } .big { font-size: 24px; } }
  button { font: 600 12px/1 inherit; font-family: inherit; border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer; background: var(--btn); color: var(--btnt); }
  button.g { background: var(--tile); color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--line); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <svg class="arch" viewBox="0 0 52 72" aria-hidden="true">
    <path class="tr" d="M6 68 V26 A20 20 0 0 1 46 26 V68" pathLength="100"/>
    <path class="fg" id="fg" d="M6 68 V26 A20 20 0 0 1 46 26 V68" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
  </svg>
  <div class="col"><div class="big" id="t">25:00</div><div class="l" id="l">Focus</div>
    <div class="btns"><button id="go">Start</button><button class="g" id="rs">Reset</button></div></div>
</div>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var th = p.get('theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
  var W = Math.max(1, Math.min(180, parseInt(p.get('work'), 10) || 25)) * 60, B = Math.max(1, Math.min(60, parseInt(p.get('break'), 10) || 5)) * 60;
  var mode = 'Focus', total = W, left = W, end = 0, timer = null;
  var $ = function (i) { return document.getElementById(i); };
  function draw() {
    var m = Math.floor(left / 60), s = left % 60;
    $('t').textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    $('l').textContent = mode; $('fg').style.strokeDashoffset = String(100 - (1 - left / total) * 100);
    document.title = (timer ? $('t').textContent + ' · ' : '') + 'Focus timer';
  }
  function tick() {
    left = Math.max(0, Math.round((end - Date.now()) / 1000)); draw();
    if (left === 0) { clearInterval(timer); timer = null; mode = mode === 'Focus' ? 'Break' : 'Focus'; total = left = mode === 'Focus' ? W : B; $('go').textContent = 'Start'; draw(); }
  }
  $('go').onclick = function () {
    if (timer) { clearInterval(timer); timer = null; $('go').textContent = 'Resume'; return; }
    end = Date.now() + left * 1000; timer = setInterval(tick, 250); $('go').textContent = 'Pause';
  };
  $('rs').onclick = function () { clearInterval(timer); timer = null; mode = 'Focus'; total = left = W; $('go').textContent = 'Start'; draw(); };
  draw();
})();
</script>
</body>
</html>
