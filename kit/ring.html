<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css"><script src="kit.js"></script><title>Ring progress</title><style>.w{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:12px;padding:10px 4px;justify-items:center}.r{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}svg{width:var(--sz,84px);height:var(--sz,84px);display:block}.tr{stroke:var(--track)}.ol{stroke:var(--line);fill:none}.fl{stroke:var(--fill);transition:stroke-dashoffset .6s ease-out}.c{font:600 15px Inter,system-ui,sans-serif;fill:var(--accent);font-variant-numeric:tabular-nums}@media (prefers-reduced-motion:reduce){.fl{transition:none}}</style></head><body>
<div class="w" id="w" role="group" aria-label="Progress rings"></div>
<script>
(function(){var w=document.getElementById('w');var NS='http://www.w3.org/2000/svg';var val=WK.num('value'),max=WK.num('max');var custom=val!==null&&max!==null&&max>0;
var show=custom?['custom']:(WK.P.get('show')||'year,month').split(',').filter(function(x){return ['year','month','week','day'].indexOf(x)>-1}).slice(0,4);if(!show.length)show=['year','month'];
var cols=innerWidth>=show.length*100?show.length:Math.min(2,show.length);w.style.setProperty('--cols',cols);
function pct(kind,n){if(kind==='custom')return Math.min(100,Math.max(0,Math.round(val/max*100)));var s,e;if(kind==='year'){s=new Date(n.getFullYear(),0,1);e=new Date(n.getFullYear()+1,0,1)}else if(kind==='month'){s=new Date(n.getFullYear(),n.getMonth(),1);e=new Date(n.getFullYear(),n.getMonth()+1,1)}else if(kind==='week'){var off=(n.getDay()+6)%7;s=new Date(n.getFullYear(),n.getMonth(),n.getDate()-off);e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+7)}else{s=WK.startOfDay(n);e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+1)}return Math.min(100,Math.max(0,Math.floor((n-s)/(e-s)*100)))}
var lab={custom:function(){return WK.text('label','Progress',24)},year:function(n){return String(n.getFullYear())},month:function(n){return n.toLocaleString('en-GB',{month:'short'})},week:function(){return 'Week'},day:function(){return 'Today'}};
function mk(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e}
function r(n){w.innerHTML='';show.forEach(function(k){var p=pct(k,n);var R=34,C=2*Math.PI*R;var box=WK.el('div','r');var svg=mk('svg',{viewBox:'0 0 84 84',role:'img','aria-label':lab[k](n)+' '+p+' percent'});
svg.appendChild(mk('circle',{cx:42,cy:42,r:R,fill:'none','stroke-width':9,'class':'tr'}));svg.appendChild(mk('circle',{cx:42,cy:42,r:R+4.5,'stroke-width':1,'class':'ol'}));svg.appendChild(mk('circle',{cx:42,cy:42,r:R-4.5,'stroke-width':1,'class':'ol'}));
var f=mk('circle',{cx:42,cy:42,r:R,fill:'none','stroke-width':9,'class':'fl','stroke-dasharray':C.toFixed(2),'stroke-dashoffset':(C*(1-p/100)).toFixed(2),'stroke-linecap':p>0&&p<100?'round':'butt',transform:'rotate(-90 42 42)'});if(p===0)f.setAttribute('stroke-opacity','0');svg.appendChild(f);
var tx=mk('text',{x:42,y:47,'text-anchor':'middle','class':'c'});tx.textContent=p+'%';svg.appendChild(tx);box.appendChild(svg);box.appendChild(WK.el('span','k',lab[k](n)));w.appendChild(box)})}
r(new Date());if(!custom)WK.onNewMinute(r);})();
</script></body></html>
