<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css"><script src="kit.js"></script><title>Mini calendar</title><style>.w{padding:8px 4px;max-width:420px;margin:auto}.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.m{font-style:italic;color:var(--accent);font-size:18px}table{width:100%;border-collapse:collapse;table-layout:fixed}th{font:600 10px Inter,system-ui,sans-serif;letter-spacing:.1em;color:var(--muted);padding:3px 0}td{text-align:center;font:13px/1 Inter,system-ui,sans-serif;color:var(--ink);padding:5px 0;font-variant-numeric:tabular-nums}td.o{color:var(--muted);opacity:.55}td.today span{display:inline-block;min-width:24px;padding:4px 0;border-radius:999px;background:var(--accent);color:var(--soft);font-weight:700}</style></head><body>
<div class="w"><div class="hd"><span class="m" id="m"></span><span class="s" id="y"></span></div><table aria-describedby="m"><thead><tr id="h"></tr></thead><tbody id="b"></tbody></table></div>
<script>
(function(){var mon=WK.pick('start',['mon','sun'],'mon')==='mon';var names=mon?['Mo','Tu','We','Th','Fr','Sa','Su']:['Su','Mo','Tu','We','Th','Fr','Sa'];
function r(now){var y=now.getFullYear(),mo=now.getMonth();document.getElementById('m').textContent=now.toLocaleString('en-GB',{month:'long'});document.getElementById('y').textContent=y;var h=document.getElementById('h');h.innerHTML='';names.forEach(function(n){var th=document.createElement('th');th.textContent=n;th.scope='col';h.appendChild(th)});
var first=new Date(y,mo,1),off=(first.getDay()+(mon?6:0))%7,days=new Date(y,mo+1,0).getDate(),prev=new Date(y,mo,0).getDate();var b=document.getElementById('b');b.innerHTML='';var cells=Math.ceil((off+days)/7)*7;var tr;
for(var i=0;i<cells;i++){if(i%7===0){tr=document.createElement('tr');b.appendChild(tr)}var td=document.createElement('td');var d=i-off+1;var sp=document.createElement('span');if(d<1){sp.textContent=prev+d;td.className='o'}else if(d>days){sp.textContent=d-days;td.className='o'}else{sp.textContent=d;if(d===now.getDate()){td.className='today';td.setAttribute('aria-current','date')}}td.appendChild(sp);tr.appendChild(td)}}
var shown=new Date().getDate();r(new Date());WK.onNewMinute(function(n){if(n.getDate()!==shown){shown=n.getDate();r(n)}});})();
</script></body></html>
