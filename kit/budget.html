<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css"><script src="kit.js"></script><title>Budget ring</title><style>.w{display:flex;align-items:center;gap:16px;padding:12px 4px}.ring{width:92px;height:92px;flex:none}.ring circle{fill:none;stroke-width:10}.tr{stroke:var(--track)}.fg{stroke:var(--fill);stroke-linecap:round;transition:stroke-dashoffset .5s}.fg.over{stroke:var(--accent)}.big{font:600 22px/1.1 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}.row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}input{font:13px Inter,system-ui,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 8px;width:84px}input:focus-visible{outline:2px solid var(--accent)}@media (prefers-reduced-motion:reduce){.fg{transition:none}}</style></head><body>
<div class="frame"><div class="w"><svg class="ring" viewBox="0 0 100 100" role="img" aria-label="Budget used"><circle class="tr" cx="50" cy="50" r="42"/><circle class="fg" id="r" cx="50" cy="50" r="42" transform="rotate(-90 50 50)" stroke-dasharray="263.9" stroke-dashoffset="263.9"/></svg>
<div style="min-width:0"><div class="k" id="k">Month budget</div><div class="big" id="big"></div><div class="s" id="s"></div><div class="row"><input id="a" inputmode="decimal" placeholder="Spent" aria-label="Amount spent"><button id="add">Add</button><button id="ed">Set budget</button><button id="rs">Reset</button></div></div></div></div>
<script>(function(){function S(k){var m={};return{get:function(d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return m.v!==undefined?m.v:d}},set:function(v){m.v=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}}}function today(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
var C=WK.text('cur','$',3),st=S('wk-budget-'+WK.text('key','a',20));var d=st.get({b:WK.num('budget')||0,s:0,m:new Date().getMonth()});if(d.m!==new Date().getMonth()){d.s=0;d.m=new Date().getMonth()}var ds=WK.num('demospent'),seeded=false;if(ds!==null&&!d.u&&d.s===0){d.s=ds;seeded=true}function un(){if(seeded){d.s=0;seeded=false}d.u=1}
function f(n){return C+Math.round(n).toLocaleString('en-US')}
function paint(){var left=d.b-d.s,p=d.b>0?Math.min(1,d.s/d.b):0,r=document.getElementById('r');r.style.strokeDashoffset=263.9*(1-p);r.setAttribute('class','fg'+(d.s>d.b&&d.b>0?' over':''));document.getElementById('big').textContent=d.b>0?f(left)+' left':'Set a budget';document.getElementById('s').textContent=f(d.s)+' of '+f(d.b)+' spent'+(seeded?' · sample':'');document.getElementById('k').textContent=WK.text('label','Month budget',24);}
document.getElementById('add').onclick=function(){var v=parseFloat(document.getElementById('a').value);if(isFinite(v)&&v>0){un();d.s+=v;st.set(d);document.getElementById('a').value='';paint()}};
document.getElementById('ed').onclick=function(){var v=parseFloat(document.getElementById('a').value);if(isFinite(v)&&v>=0){un();d.b=v;st.set(d);document.getElementById('a').value='';paint()}};
document.getElementById('rs').onclick=function(){un();d.s=0;st.set(d);paint()};paint();})();</script></body></html>
