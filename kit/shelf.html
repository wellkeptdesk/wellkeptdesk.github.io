<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shelf</title>
<style>
:root{--bg:#F3F3F2;--paper:#FBFBFA;--ink:#2B2D31;--mute:#8A8C8F;--line:#E2E2E0;--acc:#6B2D3C;--chip:#E2E2E0;--sh:rgba(43,45,49,.18)}
@media (prefers-color-scheme:dark){:root{--bg:#191919;--paper:#26272A;--ink:#E6E6E4;--mute:#8A8C8F;--line:#35373B;--acc:#B9808E;--chip:#35373B;--sh:rgba(0,0,0,.5)}}
:root[data-t=light]{--bg:#F3F3F2;--paper:#FBFBFA;--ink:#2B2D31;--mute:#8A8C8F;--line:#E2E2E0;--acc:#6B2D3C;--chip:#E2E2E0;--sh:rgba(43,45,49,.18)}
:root[data-t=dark]{--bg:#191919;--paper:#26272A;--ink:#E6E6E4;--mute:#8A8C8F;--line:#35373B;--acc:#B9808E;--chip:#35373B;--sh:rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{padding-top:20px!important;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;overflow:hidden}
.stage{position:relative;width:min(100%,230px);aspect-ratio:3/4;perspective:1100px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.leaf{position:absolute;inset:0;transform-origin:50% 0;transition:transform .8s cubic-bezier(.5,.05,.2,1);transform-style:preserve-3d;will-change:transform}
.leaf.up{transform:rotateX(-178deg);visibility:hidden;transition:transform .8s cubic-bezier(.5,.05,.2,1),visibility 0s .8s}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px;overflow:hidden}
.front{outline:1px solid var(--line)}.front img{width:100%;height:100%;display:block}
.back{transform:rotateX(180deg);background:var(--paper);box-shadow:0 6px 18px var(--sh)}
.back:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(var(--paper) 0 21px,var(--line) 21px 22px)}
.page{background:var(--paper);box-shadow:0 8px 22px var(--sh);padding:16px 16px 14px 18px;display:flex;flex-direction:column}
.page:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(90deg,rgba(0,0,0,.10),transparent)}
.rib{position:absolute;top:-2px;right:18px;width:14px;height:44px;background:var(--acc);clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)}
.k{font-size:10px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
h2{font:italic 600 22px/1.15 Georgia,"Times New Roman",serif;margin:3px 0 10px}
.note{font:italic 12.5px/1.4 Georgia,serif;color:var(--mute);margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
a{display:flex;justify-content:space-between;align-items:center;color:var(--ink);text-decoration:none;padding:5px 0;border-bottom:1px solid var(--line);font-weight:500}
a span{color:var(--mute);transition:transform .2s}a:hover span{transform:translateX(3px);color:var(--acc)}a:hover{color:var(--acc)}
.pg{margin-top:auto;font-size:10px;color:var(--mute);display:flex;justify-content:space-between}
.dots{display:flex;gap:6px;align-items:center}
.dots button{width:18px;height:24px;border:0;border-radius:2px;background:var(--chip);cursor:pointer;opacity:.55;transition:.25s;padding:0}
.dots button.on{background:var(--acc);opacity:1;height:30px}
.dots button:hover{opacity:1}
.nav{display:flex;gap:10px;align-items:center}
.nav .b{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer;font-size:14px}
.nav .b:hover{color:var(--acc);border-color:var(--acc)}
.leaf:not(.cur) .rib{opacity:0}
@media (prefers-reduced-motion:reduce){.leaf{transition:none}}
</style>
</head><body>
<div class="stage" id="st" tabindex="0" aria-label="Notebook shelf"></div>
<div class="nav"><button class="b" id="pv" aria-label="Previous">‹</button><div class="dots" id="dots"></div><button class="b" id="nx" aria-label="Next">›</button></div>
<script>
const N="https://app.notion.com/p/";
const B=[
{k:"today",t:"Today",c:"daily",n:"Log the day in two minutes.",l:[["Daily log","4dfb87163c078306b48f817f1784bb04"],["Next up","694b87163c07820ca6780150540a4e33"],["Habits","3edb87163c0782768a4981ba692fdadc"]]},
{k:"habits",t:"Habits",c:"habits",n:"Rename a habit when it stops fitting.",l:[["Daily log","4dfb87163c078306b48f817f1784bb04"],["Weekly Review","3f5b87163c07812d8ac0fb2d23c82dc8"],["Me","c18b87163c0783d5a82b81f0a9d67cc0"]]},
{k:"body",t:"Body",c:"body",n:"Protein first, then the rest.",l:[["Fitness","7d3b87163c07837ba01101f2e3cb3e47"],["Food","0e3b87163c07839e9228018e4f714a68"],["Health log","a37b87163c0783b8b98b81b9995c545d"]]},
{k:"money",t:"Money",c:"money",n:"Look at the month, not the day.",l:[["Life Lists","e4eb87163c07829db21c017fc6c0d762"],["Movies & Shows","e37b87163c078296a99001442e79246b"],["People","3f5b87163c0781a6a0e6c13175c7dead"]]},
{k:"mind",t:"Mind",c:"growth",n:"Five honest lines beat a perfect page.",l:[["Journal","5a3b87163c0783f8ac66018ae229c755"],["Notes","526b87163c0782f9899c816aa09958b7"],["Books","0a4b87163c0782c082bf8132f71d0fea"],["Learning","660b87163c0783d6b0a08183906856d8"]]},
{k:"plan",t:"Plan",c:"direction",n:"Three tasks a day is plenty.",l:[["All tasks","98db87163c0783b9aec40131218a147d"],["Projects","472b87163c07827cafe501960c97212f"],["Goals & Yearly Cycle","373b87163c07835c880e816605871a1c"]]},
{k:"life",t:"Life",c:"life",n:"Next trip: book by March.",l:[["All lists","88bb87163c078352934d81b52514ec99"],["Movies & Shows","e37b87163c078296a99001442e79246b"],["People","3f5b87163c0781a6a0e6c13175c7dead"]]},
{k:"reviews",t:"Reviews",c:"reviews",n:"Sunday, ten minutes, with tea.",l:[["Monthly Check-in","ed1b87163c07839597f681972bd0bc67"],["Insights","3f5b87163c0781d8b881eb059b3ee864"],["Goals & Yearly Cycle","373b87163c07835c880e816605871a1c"]]}];
const H=Object.fromEntries(location.hash.slice(1).split("&").filter(Boolean).map(s=>s.split("=")));
if(H.theme==="light"||H.theme==="dark")document.documentElement.dataset.t=H.theme;
const st=document.getElementById("st"),dots=document.getElementById("dots");
// items: cover0,page0,cover1,page1,...
const items=[];B.forEach((b,i)=>{items.push({b,i,kind:"cover"});items.push({b,i,kind:"page"})});
const leaves=items.map((it,j)=>{
 const L=document.createElement("div");L.className="leaf";L.style.zIndex=100-j;
 const f=document.createElement("div");f.className="face front"+(it.kind==="page"?" page":"");
 if(it.kind==="cover"){f.innerHTML=`<img src="covers/${it.b.c}.svg?v=2" alt="${it.b.t}">`}
 else{f.innerHTML=`<i class="rib"></i><div class="k">Open page</div><h2>${it.b.t}</h2><div class="note">${it.b.n}</div>`+
  it.b.l.map(x=>`<a href="${N+x[1]}" target="_blank" rel="noopener">${x[0]}<span>→</span></a>`).join("")+
  `<div class="pg"><span>${String(it.i+1).padStart(2,"0")} / 08</span><span>Tap to turn</span></div>`}
 const bk=document.createElement("div");bk.className="face back";
 L.append(f,bk);st.append(L);return L});
const start=Math.max(0,B.findIndex(b=>b.k===H.book))*2;
let cur=0; // number of leaves flipped
function go(n){n=Math.max(0,Math.min(items.length-1,n));cur=n;
 leaves.forEach((L,j)=>{L.classList.toggle("up",j<cur);L.classList.toggle("cur",j===cur);L.style.pointerEvents=(j===cur)?"auto":"none";L.style.zIndex=(j<cur)?j:100-j});
 [...dots.children].forEach((d,i)=>d.classList.toggle("on",i===Math.floor(cur/2)))}
B.forEach((b,i)=>{const d=document.createElement("button");d.title=b.t;d.onclick=()=>go(i*2);dots.append(d)});
st.addEventListener("click",e=>{if(e.target.closest("a"))return;const r=st.getBoundingClientRect();(e.clientY-r.top<r.height*.18&&cur>0)?go(cur-1):go(cur+1)});
document.getElementById("nx").onclick=()=>go(cur+1);document.getElementById("pv").onclick=()=>go(cur-1);
st.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowDown")go(cur+1);if(e.key==="ArrowLeft"||e.key==="ArrowUp")go(cur-1)});
// initial
leaves.forEach(L=>L.style.transition="none");go(start);requestAnimationFrame(()=>requestAnimationFrame(()=>leaves.forEach(L=>L.style.transition="")));
</script>

</body></html>
