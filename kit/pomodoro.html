<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css"><script src="kit.js"></script><title>Focus timer</title><style>.w{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 4px;flex-wrap:nowrap}.t{font:600 34px/1 Inter,system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}.btns{display:flex;gap:6px}.mode{font-style:italic;color:var(--accent)}:root[data-layout=session] .t{font:400 40px/1 "Source Serif 4",Georgia,serif;font-variant-numeric:lining-nums tabular-nums;margin:6px 0 4px}:root[data-layout=session] .frame{border:0;padding:4px 2px}:root[data-layout=session] button{border-color:var(--muted)}:root[data-layout=session] .s .mode,:root[data-layout=session] .s .sep{display:none}</style></head><body>
<div class="w frame"><div><div class="k" id="k">Focus</div><div class="t" id="t" role="timer" aria-live="off">25:00</div><div class="s"><span class="mode" id="mo">Focus</span><span class="sep"> · </span><span id="c">0</span> done</div></div>
<div class="btns"><button id="go" aria-pressed="false">Start</button><button id="rs">Reset</button></div></div>
<script>
(function(){var F=Math.round(Math.min(Math.max(WK.num('focus')||25,1),90)),B=Math.round(Math.min(Math.max(WK.num('break')||5,1),30));var LB=WK.text('label','',28);document.documentElement.setAttribute('data-layout',WK.pick('layout',['stack','session'],'stack'));var mode='focus',left=F*60,run=false,end=0,done=0,iv=null;
var t=document.getElementById('t'),go=document.getElementById('go'),mo=document.getElementById('mo'),k=document.getElementById('k');
function fmt(s){s=Math.max(0,Math.ceil(s));return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2)}
function paint(){t.textContent=fmt(left);mo.textContent=mode==='focus'?(LB||'Focus'):'Break';k.textContent=mode==='focus'?(LB||'Focus')+' · '+F+' min':'Break · '+B+' min';document.getElementById('c').textContent=done;go.textContent=run?'Pause':'Start';go.setAttribute('aria-pressed',run)}
function tick(){left=(end-Date.now())/1000;if(left<=0){if(mode==='focus'){done++;mode='break';left=B*60}else{mode='focus';left=F*60}end=Date.now()+left*1000;document.title=(mode==='focus'?'Focus':'Break')+' · '+fmt(left);t.setAttribute('aria-live','polite')}else{t.setAttribute('aria-live','off')}paint()}
go.onclick=function(){run=!run;if(run){end=Date.now()+left*1000;iv=setInterval(tick,250)}else{clearInterval(iv);left=(end-Date.now())/1000}paint()};
document.getElementById('rs').onclick=function(){clearInterval(iv);run=false;mode='focus';left=F*60;paint()};paint();})();
</script></body></html>
