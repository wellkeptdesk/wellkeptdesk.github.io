<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css"><script src="kit.js"></script><title>Habit grid</title><style>.g{display:grid;grid-template-columns:minmax(64px,1fr) repeat(7,28px);gap:6px 5px;align-items:center;padding:12px 4px}.h{font:13px Inter,system-ui,sans-serif;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dl{font:600 10px Inter,system-ui,sans-serif;color:var(--muted);text-align:center;letter-spacing:.06em}.dl.t{color:var(--brass)}.c{width:28px;height:28px;padding:0;border-radius:7px;border:1px solid var(--line);background:var(--track)}.c[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}.c.t{box-shadow:0 0 0 2px var(--brass)}.n{font:12px Inter,system-ui,sans-serif;color:var(--muted);padding:2px 4px}</style></head><body>
