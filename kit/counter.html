<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css"><script src="kit.js"></script><title>Counter</title><style>.w{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 4px}.t{font:600 34px/1 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}.t span{font-size:16px;color:var(--muted);font-weight:500}.btns{display:flex;gap:6px}.btns button{width:38px;height:38px;padding:0;font-size:18px;border-radius:10px}.bar i.full{background:var(--accent)}</style></head><body>
<div class="frame"><div class="w"><div style="flex:1;min-width:0"><div class="k" id="k">Water</div><div class="t" id="t">0<span> / 8</span></div><div class="bar"><i id="b"></i></div><div class="s" id="s"></div></div><div class="btns"><button id="m" aria-label="Remove one">−</button><button id="p" aria-label="Add one">+</button></div></div></div>
<script>(function(){function S(k){var m={};return{get:function(d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return m.v!==undefined?m.v:d}},set:function(v){m.v=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}}}function today(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
var L=WK.text('label','Water',24),goal=Math.min(Math.max(WK.num('goal')||8,1),9999),step=Math.min(Math.max(WK.num('step')||1,1),1000),unit=WK.text('unit','',12);var st=S('wk-counter-'+WK.text('key',L,20));var d=st.get({d:today(),v:0});if(d.d!==today())d={d:today(),v:0};
function paint(){document.getElementById('k').textContent=L;document.getElementById('t').innerHTML=d.v+'<span> / '+goal+(unit?' '+unit:'')+'</span>';var b=document.getElementById('b');b.style.width=Math.min(100,d.v/goal*100)+'%';b.className=d.v>=goal?'full':'';document.getElementById('s').textContent=d.v>=goal?'Goal reached':(goal-d.v)+(unit?' '+unit:'')+' to go';}
document.getElementById('p').onclick=function(){d.v+=step;st.set(d);paint()};document.getElementById('m').onclick=function(){d.v=Math.max(0,d.v-step);st.set(d);paint()};paint();})();</script></body></html>
