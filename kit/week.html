<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css"><script src="kit.js"></script><title>Week</title><style>.w{padding:10px 4px}.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}.st{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.d{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:10px}.d .k{font-size:10px;letter-spacing:.08em}.d .n{font:600 16px/1 Inter,system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}.d.past .n{color:var(--muted);font-weight:500}@media (max-width:200px){.st{gap:1px}.d{padding:5px 0;border-radius:8px}.d .n{font-size:12.5px}.d .k{font-size:9px;letter-spacing:.02em}}.d[aria-current=date]{background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}.d[aria-current=date] .n{color:var(--accent)}.d[aria-current=date] .k{color:var(--accent)}</style></head><body>
<div class="w frame" id="w"><div class="hd"><span class="k" id="h"></span><span class="v" id="m"></span></div><div class="st" id="s" role="list"></div></div>
<script>
(function(){var sun=WK.pick('start',['mon','sun'],'mon')==='sun';var s=document.getElementById('s');
function r(n){s.innerHTML='';var off=sun?n.getDay():(n.getDay()+6)%7;var first=new Date(n.getFullYear(),n.getMonth(),n.getDate()-off);var iw=WK.isoWeek(n);document.getElementById('h').textContent='Week '+iw.week;document.getElementById('m').textContent=n.toLocaleDateString('en-GB',{month:innerWidth<200?'short':'long'});
for(var i=0;i<7;i++){var d=new Date(first.getFullYear(),first.getMonth(),first.getDate()+i);var c=WK.el('div','d');c.setAttribute('role','listitem');var cmp=WK.daysBetween(n,d);if(cmp===0)c.setAttribute('aria-current','date');else if(cmp<0)c.className+=' past';c.appendChild(WK.el('span','k',d.toLocaleDateString('en-GB',{weekday:'short'}).slice(0,2)));c.appendChild(WK.el('span','n',String(d.getDate())));c.setAttribute('aria-label',d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})+(cmp===0?', today':''));s.appendChild(c);}}
r(new Date());WK.onNewMinute(function(n){if(n.getHours()===0&&n.getMinutes()===0)r(n)});})();
</script></body></html>
