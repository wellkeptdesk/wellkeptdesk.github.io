<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css"><script src="kit.js"></script><title>Analog clock</title><style>.w{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px}svg{width:var(--sz,120px);height:var(--sz,120px)}.face{fill:none;stroke:var(--line);stroke-width:1.5}.tk{stroke:var(--muted);stroke-width:2;stroke-linecap:round}.tk.m{stroke-width:1;opacity:.6}.hh{stroke:var(--ink);stroke-width:4;stroke-linecap:round}.mh{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}.sh{stroke:var(--accent);stroke-width:1.2}.cap{fill:var(--accent)}.d{font-style:italic;color:var(--accent);font-size:14px}</style></head><body>
<div class="w"><svg id="c" viewBox="0 0 120 120" role="img"></svg><div class="d" id="d"></div></div>
<script>
(function(){var NS='http://www.w3.org/2000/svg';var c=document.getElementById('c');var sec=WK.P.get('seconds')==='1'&&!WK.reduced;var showDate=WK.P.get('date')!=='0';
function mk(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e}
c.appendChild(mk('circle',{cx:60,cy:60,r:56,'class':'face'}));for(var i=0;i<12;i++){var a=i*30*Math.PI/180,q=i%3===0;var r1=q?44:48;c.appendChild(mk('line',{x1:60+r1*Math.sin(a),y1:60-r1*Math.cos(a),x2:60+52*Math.sin(a),y2:60-52*Math.cos(a),'class':'tk'+(q?'':' m')}))}
var hh=mk('line',{x1:60,y1:60,x2:60,y2:32,'class':'hh',id:'hh'}),mh=mk('line',{x1:60,y1:60,x2:60,y2:16,'class':'mh',id:'mh'});c.appendChild(hh);c.appendChild(mh);var sh=null;if(sec){sh=mk('line',{x1:60,y1:66,x2:60,y2:12,'class':'sh',id:'sh'});c.appendChild(sh)}c.appendChild(mk('circle',{cx:60,cy:60,r:3.2,'class':'cap'}));
function r(n){var H=n.getHours()%12,M=n.getMinutes(),S=n.getSeconds();hh.setAttribute('transform','rotate('+(H*30+M*0.5)+' 60 60)');mh.setAttribute('transform','rotate('+(M*6)+' 60 60)');if(sh)sh.setAttribute('transform','rotate('+(S*6)+' 60 60)');var t=('0'+n.getHours()).slice(-2)+':'+('0'+M).slice(-2);c.setAttribute('aria-label','Time '+t);document.getElementById('d').textContent=showDate?n.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}):''}
r(new Date());if(sec){setInterval(function(){if(document.visibilityState==='visible')r(new Date())},1000)}else{WK.onNewMinute(r)}})();
</script></body></html>
