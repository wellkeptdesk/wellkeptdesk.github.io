<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css"><script src="kit.js"></script><title>Daily quote</title><style>.w{padding:12px 4px}.q{font-style:italic;font-size:17px;line-height:1.4;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.a{margin-top:6px}</style></head><body>
<figure class="w frame" id="w"><blockquote class="q" id="q"></blockquote><figcaption class="k a" id="a"></figcaption></figure>
<script>
(function(){var Q=[["It is not that we have a short time to live, but that we waste a lot of it.","Seneca"],["While we are postponing, life speeds by.","Seneca"],["Waste no more time arguing about what a good man should be. Be one.","Marcus Aurelius"],["Lost time is never found again.","Benjamin Franklin"],["Well done is better than well said.","Benjamin Franklin"],["Our life is frittered away by detail. Simplify, simplify.","Henry David Thoreau"],["It is not enough to be busy. The question is: what are we busy about?","Henry David Thoreau"],["Finish each day and be done with it.","Ralph Waldo Emerson"],["A journey of a thousand miles begins with a single step.","Lao Tzu"],["Nothing is particularly hard if you divide it into small jobs.","Henry Ford"],["Wisely and slow; they stumble that run fast.","William Shakespeare"],["Well begun is half done.","Aristotle (proverb)"]];
var set=WK.text('quote','',160),by=WK.text('by','',40);
function r(n){var q,a;if(set){q=set;a=by}else{var day=Math.floor(WK.startOfDay(n).getTime()/86400000);var x=Q[((day%Q.length)+Q.length)%Q.length];q=x[0];a=x[1]}document.getElementById('q').textContent='“'+q+'”';document.getElementById('a').textContent=a?'— '+a:''}
var shown=new Date().getDate();r(new Date());WK.onNewMinute(function(n){if(n.getDate()!==shown){shown=n.getDate();r(n)}});})();
</script></body></html>
