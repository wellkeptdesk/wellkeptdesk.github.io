<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css"><script src="kit.js"></script><title>Daily quote</title><style>.w{padding:12px 4px}.q{font-style:italic;font-size:17px;line-height:1.4;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.a{margin-top:6px}.kk{display:none;margin-bottom:8px}:root[data-size=large] .kk{display:block}:root[data-size=large] .w{border-bottom:0;padding-top:14px}:root[data-size=large] .q{font:italic 400 26px/1.3 "Source Serif 4",Georgia,serif;-webkit-line-clamp:4;text-wrap:balance}:root[data-size=large] .a{margin-top:12px}</style></head><body>
<figure class="w frame" id="w"><div class="k kk" id="kk">Today’s line</div><blockquote class="q" id="q"></blockquote><figcaption class="k a" id="a"></figcaption></figure>
<script>
(function(){var Q=[["It is not that we have a short time to live, but that we waste a lot of it.","Seneca"],["While we are postponing, life speeds by.","Seneca"],["Waste no more time arguing about what a good man should be. Be one.","Marcus Aurelius"],["Lost time is never found again.","Benjamin Franklin"],["Well done is better than well said.","Benjamin Franklin"],["Our life is frittered away by detail. Simplify, simplify.","Henry David Thoreau"],["It is not enough to be busy. The question is: what are we busy about?","Henry David Thoreau"],["Finish each day and be done with it.","Ralph Waldo Emerson"],["A journey of a thousand miles begins with a single step.","Lao Tzu"],["Nothing is particularly hard if you divide it into small jobs.","Henry Ford"],["Wisely and slow; they stumble that run fast.","William Shakespeare"],["Well begun is half done.","Aristotle (proverb)"]];
var SH=[["Call me Ishmael.","Moby-Dick · Herman Melville"],["Mrs. Dalloway said she would buy the flowers herself.","Mrs Dalloway · Virginia Woolf"],["I would always rather be happy than dignified.","Jane Eyre · Charlotte Brontë"],["Nothing is so painful to the human mind as a great and sudden change.","Frankenstein · Mary Shelley"],["She had been forced into prudence in her youth, she learned romance as she grew older.","Persuasion · Jane Austen"],["I am large, I contain multitudes.","Leaves of Grass · Walt Whitman"],["Very little is needed to make a happy life…","Meditations · Marcus Aurelius"],["Above all, don't lie to yourself.","The Brothers Karamazov · Fyodor Dostoevsky"]];
if(WK.pick('set',['default','shelf'],'default')==='shelf')Q=SH;document.documentElement.setAttribute('data-size',WK.pick('size',['normal','large'],'normal'));var kl=WK.text('kicker','',28);if(kl)document.getElementById('kk').textContent=kl;
var set=WK.text('quote','',160),by=WK.text('by','',40);
function r(n){var q,a;if(set){q=set;a=by}else{var day=Math.floor(WK.startOfDay(n).getTime()/86400000);var x=Q[((day%Q.length)+Q.length)%Q.length];q=x[0];a=x[1]}document.getElementById('q').textContent='“'+q+'”';document.getElementById('a').textContent=a?'— '+a:''}
var shown=new Date().getDate();r(new Date());WK.onNewMinute(function(n){if(n.getDate()!==shown){shown=n.getDate();r(n)}});})();
</script></body></html>
