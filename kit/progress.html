<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="base.css"><script src="kit.js"></script><title>Progress</title><style>.w{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:10px 24px;padding:12px 4px}.row .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.row .v{font-size:16px}</style></head><body>
<div class="w frame" id="w" role="group" aria-label="Time progress"></div>
<script>
(function(){var show=(WK.P.get('show')||'year,month,week,day').split(',').filter(function(x){return ['year','month','week','day'].indexOf(x)>-1}).slice(0,4);if(!show.length)show=['year','month'];
var w=document.getElementById('w');var cols=Math.min(show.length,innerWidth<640?2:4);w.style.setProperty('--cols',cols);
function pct(kind,n){var s,e;if(kind==='year'){s=new Date(n.getFullYear(),0,1);e=new Date(n.getFullYear()+1,0,1)}else if(kind==='month'){s=new Date(n.getFullYear(),n.getMonth(),1);e=new Date(n.getFullYear(),n.getMonth()+1,1)}else if(kind==='week'){var off=(n.getDay()+6)%7;s=new Date(n.getFullYear(),n.getMonth(),n.getDate()-off);e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+7)}else{s=WK.startOfDay(n);e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+1)}return Math.min(100,Math.max(0,Math.floor((n-s)/(e-s)*100)))}
var lab={year:function(n){return String(n.getFullYear())},month:function(n){return n.toLocaleString('en-GB',{month:cols>2?'short':'long'})},week:function(){return cols>2?'Week':'This week'},day:function(){return 'Today'}};
function r(n){w.innerHTML='';show.forEach(function(k){var p=pct(k,n);var row=document.createElement('div');row.className='row';var top=document.createElement('div');top.className='top';var kk=document.createElement('span');kk.className='k';kk.textContent=lab[k](n);var v=document.createElement('span');v.className='v';v.textContent=p+'%';top.appendChild(kk);top.appendChild(v);var bar=document.createElement('div');bar.className='bar';bar.setAttribute('role','img');bar.setAttribute('aria-label',lab[k](n)+' '+p+' percent complete');var i=document.createElement('i');i.style.width=p+'%';bar.appendChild(i);row.appendChild(top);row.appendChild(bar);w.appendChild(row)})}
r(new Date());WK.onNewMinute(r);})();
</script></body></html>
