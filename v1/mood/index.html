<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Mood check-in · WellKeptDesk</title>
<style>
  :root { --ink: #2F3332; --muted: #7C8279; --line: #6B8071; --track: #E7E5DF; --tile: #F4F2EE; --btn: #2F3332; --btnt: #fff; --sand: #D9C9B0; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ECEBE6; --muted: #A3A89F; --line: #9DAE9F; --track: #3A3F3C; --tile: #2A2E2C; --btn: #ECEBE6; --btnt: #222624; --sand: #8A7B64; } }
  html[data-theme="light"] { --ink:#2F3332; --muted:#7C8279; --line:#6B8071; --track:#E7E5DF; --tile:#F4F2EE; --btn:#2F3332; --btnt:#fff; --sand:#D9C9B0; }
  html[data-theme="dark"]  { --ink:#ECEBE6; --muted:#A3A89F; --line:#9DAE9F; --track:#3A3F3C; --tile:#2A2E2C; --btn:#ECEBE6; --btnt:#222624; --sand:#8A7B64; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: ui-sans-serif, -apple-system, "Segoe UI Variable Display", "Segoe UI", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; color: var(--ink); }
  .wrap { height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 0 2px; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-width: 0; }
  .name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .big { font-size: 30px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; white-space: nowrap; }
  .big small { font-size: 14px; color: var(--muted); font-weight: 600; margin-left: 4px; letter-spacing: 0; }
  .l { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .l2 { color: var(--muted); font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { font: 600 12px/1 inherit; font-family: inherit; border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer; background: var(--btn); color: var(--btnt); }
  button.g { background: var(--tile); color: var(--ink); }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--line); outline-offset: 2px; }
  .faces { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .f { aspect-ratio: 1; max-height: 40px; padding: 0; border-radius: 50%; background: var(--tile); display: grid; place-items: center; }
  .f svg { width: 62%; height: 62%; } .f svg * { fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; }
  .f.on { background: var(--line); } .f.on svg * { stroke: var(--btnt); }
  .strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .s { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .s i { width: 100%; height: 22px; border-radius: 5px; background: var(--track); display: block; }
  .s span { font-size: 10px; font-weight: 600; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="name">How is today?</div><div class="l" id="w"></div></div>
  <div class="faces" id="faces"></div>
  <div class="strip" id="strip"></div>
</div>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var th = p.get('theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
  var $ = function (i) { return document.getElementById(i); };
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  var key = 'wkd-mood', M = ['Low','Meh','Okay','Good','Great'];
  var mouth = ['M7 17 Q12 12 17 17','M7 16 Q12 14 17 16','M7 15 H17','M7 14 Q12 17 17 14','M7 13 Q12 19 17 13'];
  var data = {}; try { data = JSON.parse(store(key) || '{}') || {}; } catch (e) {}
  var op = [.25,.4,.6,.8,1];
  function draw() {
    var today = ymd(new Date()), fb = $('faces'), sb = $('strip'); fb.innerHTML = ''; sb.innerHTML = '';
    M.forEach(function (m, i) {
      var b = document.createElement('button'); b.className = 'f' + (data[today] === i + 1 ? ' on' : ''); b.title = m; b.setAttribute('aria-label', m);
      b.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="8.5" cy="9.5" r=".6"/><circle cx="15.5" cy="9.5" r=".6"/><path d="' + mouth[i] + '"/></svg>';
      b.onclick = function () { if (data[today] === i + 1) delete data[today]; else data[today] = i + 1; store(key, JSON.stringify(data)); draw(); };
      fb.appendChild(b);
    });
    var sum = 0, n = 0;
    for (var k = 6; k >= 0; k--) {
      var d = new Date(); d.setDate(d.getDate() - k); var v = data[ymd(d)];
      var c = document.createElement('div'); c.className = 's';
      var bar = document.createElement('i'); if (v) { bar.style.background = 'var(--line)'; bar.style.opacity = op[v - 1]; sum += v; n++; }
      bar.title = d.toDateString() + (v ? ': ' + M[v - 1] : '');
      var s = document.createElement('span'); s.textContent = 'SMTWTFS'[d.getDay()];
      c.appendChild(bar); c.appendChild(s); sb.appendChild(c);
    }
    $('w').textContent = n ? 'Week avg ' + (sum / n).toFixed(1) : 'Last 7 days';
  }
  draw();
})();
</script>
</body>
</html>
