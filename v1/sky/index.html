<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Moon and sun · WellKeptDesk</title>
<style>
  :root { --ink: #2F3332; --muted: #7C8279; --lit: #6B8071; --dark: #E7E5DF; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ECEBE6; --muted: #A3A89F; --lit: #CBD3C8; --dark: #3A3F3C; } }
  html[data-theme="light"] { --ink:#2F3332; --muted:#7C8279; --lit:#6B8071; --dark:#E7E5DF; }
  html[data-theme="dark"]  { --ink:#ECEBE6; --muted:#A3A89F; --lit:#CBD3C8; --dark:#3A3F3C; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: ui-sans-serif, -apple-system, "Segoe UI Variable Display", "Segoe UI", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { height: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 2px; }
  .moon { flex: none; width: 56px; height: 56px; }
  .col { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
  .big { color: var(--ink); font-size: 17px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .l1 { color: var(--muted); font-size: 12px; font-weight: 500; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .l2 { color: var(--ink); font-size: 12.5px; font-weight: 600; margin-top: 5px; font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; column-gap: 6px; }
  .l2 span { white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 260px) { .moon { width: 40px; height: 40px; } .big { font-size: 15px; } }
</style>
</head>
<body>
<div class="wrap">
  <svg class="moon" viewBox="0 0 56 56" aria-hidden="true">
    <circle cx="28" cy="28" r="24" fill="var(--dark)"/>
    <path id="lit" d="" fill="var(--lit)"/>
  </svg>
  <div class="col"><div class="big" id="big">--</div><div class="l1" id="l1">&nbsp;</div><div class="l2" id="l2">&nbsp;</div></div>
</div>
<script>
(function () {
  // Everything here is computed in the browser. No network requests, no third-party services.
  var q = new URLSearchParams(location.search.replace(/&amp;/g, "&"));
  var th = q.get('theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
  var $ = function (id) { return document.getElementById(id); };
  var SYN = 29.530588853, REF = Date.UTC(2000, 0, 6, 18, 14);
  var NAMES = ['New moon', 'Waxing crescent', 'First quarter', 'Waxing gibbous', 'Full moon', 'Waning gibbous', 'Last quarter', 'Waning crescent'];
  function moon() {
    var age = (((Date.now() - REF) / 864e5) % SYN + SYN) % SYN;
    var f = age / SYN, ill = (1 - Math.cos(2 * Math.PI * f)) / 2;
    var name = NAMES[Math.floor(f * 8 + 0.5) % 8];
    var r = 24, cx = 28, cy = 28, waxing = f < 0.5;
    var k = Math.cos(2 * Math.PI * f);
    var rx = Math.abs(k) * r;
    var limb = waxing ? 1 : 0;
    var d = 'M' + cx + ' ' + (cy - r) + ' A' + r + ' ' + r + ' 0 0 ' + limb + ' ' + cx + ' ' + (cy + r) +
            ' A' + rx.toFixed(2) + ' ' + r + ' 0 0 ' + (k > 0 ? 1 - limb : limb) + ' ' + cx + ' ' + (cy - r) + 'Z';
    $('lit').setAttribute('d', d);
    $('big').textContent = name;
    $('l1').textContent = Math.round(ill * 100) + '% lit · day ' + (Math.floor(age) + 1) + ' of ' + Math.round(SYN);
  }

  // [name, IANA time zone, latitude, longitude]
  var CITIES = [
    ['London','Europe/London',51.51,-0.13],['Dublin','Europe/Dublin',53.35,-6.26],['Paris','Europe/Paris',48.86,2.35],
    ['Berlin','Europe/Berlin',52.52,13.40],['Amsterdam','Europe/Amsterdam',52.37,4.90],['Brussels','Europe/Brussels',50.85,4.35],
    ['Madrid','Europe/Madrid',40.42,-3.70],['Lisbon','Europe/Lisbon',38.72,-9.14],['Rome','Europe/Rome',41.90,12.50],
    ['Vienna','Europe/Vienna',48.21,16.37],['Zurich','Europe/Zurich',47.38,8.54],['Prague','Europe/Prague',50.08,14.44],
    ['Warsaw','Europe/Warsaw',52.23,21.01],['Stockholm','Europe/Stockholm',59.33,18.07],['Oslo','Europe/Oslo',59.91,10.75],
    ['Copenhagen','Europe/Copenhagen',55.68,12.57],['Helsinki','Europe/Helsinki',60.17,24.94],['Athens','Europe/Athens',37.98,23.73],
    ['Istanbul','Europe/Istanbul',41.01,28.98],['Ankara','Europe/Istanbul',39.93,32.86],['Izmir','Europe/Istanbul',38.42,27.14],
    ['Kyiv','Europe/Kyiv',50.45,30.52],['Moscow','Europe/Moscow',55.76,37.62],['Reykjavik','Atlantic/Reykjavik',64.15,-21.94],
    ['New York','America/New_York',40.71,-74.01],['Toronto','America/Toronto',43.65,-79.38],['Chicago','America/Chicago',41.88,-87.63],
    ['Denver','America/Denver',39.74,-104.99],['Phoenix','America/Phoenix',33.45,-112.07],['Los Angeles','America/Los_Angeles',34.05,-118.24],
    ['San Francisco','America/Los_Angeles',37.77,-122.42],['Seattle','America/Los_Angeles',47.61,-122.33],['Vancouver','America/Vancouver',49.28,-123.12],
    ['Mexico City','America/Mexico_City',19.43,-99.13],['Anchorage','America/Anchorage',61.22,-149.90],['Honolulu','Pacific/Honolulu',21.31,-157.86],
    ['Sao Paulo','America/Sao_Paulo',-23.55,-46.63],['Buenos Aires','America/Argentina/Buenos_Aires',-34.60,-58.38],['Bogota','America/Bogota',4.71,-74.07],
    ['Santiago','America/Santiago',-33.45,-70.67],['Lima','America/Lima',-12.05,-77.04],
    ['Cairo','Africa/Cairo',30.04,31.24],['Lagos','Africa/Lagos',6.52,3.38],['Nairobi','Africa/Nairobi',-1.29,36.82],
    ['Johannesburg','Africa/Johannesburg',-26.20,28.05],['Cape Town','Africa/Johannesburg',-33.92,18.42],['Casablanca','Africa/Casablanca',33.57,-7.59],
    ['Dubai','Asia/Dubai',25.20,55.27],['Riyadh','Asia/Riyadh',24.71,46.68],['Tel Aviv','Asia/Jerusalem',32.09,34.78],
    ['Tehran','Asia/Tehran',35.69,51.39],['Karachi','Asia/Karachi',24.86,67.01],['Delhi','Asia/Kolkata',28.61,77.21],
    ['Mumbai','Asia/Kolkata',19.08,72.88],['Dhaka','Asia/Dhaka',23.81,90.41],['Bangkok','Asia/Bangkok',13.76,100.50],
    ['Jakarta','Asia/Jakarta',-6.21,106.85],['Singapore','Asia/Singapore',1.35,103.82],['Kuala Lumpur','Asia/Kuala_Lumpur',3.14,101.69],
    ['Manila','Asia/Manila',14.60,120.98],['Hong Kong','Asia/Hong_Kong',22.32,114.17],['Shanghai','Asia/Shanghai',31.23,121.47],
    ['Beijing','Asia/Shanghai',39.90,116.41],['Taipei','Asia/Taipei',25.03,121.57],['Seoul','Asia/Seoul',37.57,126.98],
    ['Tokyo','Asia/Tokyo',35.68,139.69],['Sydney','Australia/Sydney',-33.87,151.21],['Melbourne','Australia/Melbourne',-37.81,144.96],
    ['Perth','Australia/Perth',-31.95,115.86],['Auckland','Pacific/Auckland',-36.85,174.76]
  ];
  function findCity(name) {
    var n = name.trim().toLowerCase().replace(/_/g, ' ');
    for (var i = 0; i < CITIES.length; i++) if (CITIES[i][0].toLowerCase() === n) return CITIES[i];
    return null;
  }
  function deviceTz() { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { return ''; } }
  function pick() {
    var lat = parseFloat(q.get('lat')), lon = parseFloat(q.get('lon'));
    if (isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180)
      return { name: (q.get('place') || '').slice(0, 24), tz: q.get('tz') || deviceTz(), lat: lat, lon: lon };
    var c = q.get('city') ? findCity(q.get('city')) : null;
    if (!c) {
      var z = deviceTz(), best = null;
      for (var i = 0; i < CITIES.length; i++) if (CITIES[i][1] === z) { best = CITIES[i]; break; }
      c = best;
    }
    return c ? { name: c[0], tz: c[1], lat: c[2], lon: c[3] } : null;
  }

  // Sunrise equation (Wikipedia / NOAA), accurate to about a minute or two.
  function rad(x) { return x * Math.PI / 180; }
  function sunTimes(y, m, d, lat, lon) {
    var jdNoon = Date.UTC(y, m - 1, d, 12) / 864e5 + 2440587.5;
    var n = Math.round(jdNoon - 2451545.0 + 0.0008);
    var Js = n - lon / 360;
    var M = (357.5291 + 0.98560028 * Js) % 360;
    var C = 1.9148 * Math.sin(rad(M)) + 0.02 * Math.sin(rad(2 * M)) + 0.0003 * Math.sin(rad(3 * M));
    var L = (M + C + 180 + 102.9372) % 360;
    var Jt = 2451545.0 + Js + 0.0053 * Math.sin(rad(M)) - 0.0069 * Math.sin(rad(2 * L));
    var sd = Math.sin(rad(L)) * Math.sin(rad(23.4397));
    var cd = Math.cos(Math.asin(sd));
    var cw = (Math.sin(rad(-0.833)) - Math.sin(rad(lat)) * sd) / (Math.cos(rad(lat)) * cd);
    if (cw > 1) return { polar: 'night' };
    if (cw < -1) return { polar: 'day' };
    var w = Math.acos(cw) * 180 / Math.PI;
    var toMs = function (J) { return (J - 2440587.5) * 864e5; };
    return { rise: toMs(Jt - w / 360), set: toMs(Jt + w / 360) };
  }
  function sun() {
    var p = pick(), l2 = $('l2');
    l2.textContent = '';
    if (!p) return;
    try {
      var parts = new Intl.DateTimeFormat('en-CA', { timeZone: p.tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()).split('-');
      var t = sunTimes(+parts[0], +parts[1], +parts[2], p.lat, p.lon);
      var fmt = new Intl.DateTimeFormat('en-GB', { timeZone: p.tz, hour: '2-digit', minute: '2-digit', hour12: false });
      var items = t.polar
        ? [t.polar === 'day' ? 'Sun up all day' : 'Sun down all day']
        : ['↑ ' + fmt.format(new Date(t.rise)) + '   ↓ ' + fmt.format(new Date(t.set))];
      if (p.name) items.push('· ' + p.name);
      items.forEach(function (s) { var e = document.createElement('span'); e.textContent = s; l2.appendChild(e); });
    } catch (e) { l2.textContent = ''; }
  }
  moon(); sun(); setInterval(function () { moon(); sun(); }, 30 * 60 * 1000);
})();
</script>
</body>
</html>
