<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Week grid</title>
<style>
@font-face{font-family:Inter;src:url(../../kit/fonts/inter-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Inter;src:url(../../kit/fonts/inter-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Inter;src:url(../../kit/fonts/inter-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
/* Swiss week grid. Class B: local interactive, saved in this browser only, never reads Notion.
   Tokens: DI 8.0 Swiss Modernism palette (COLOR_INTELLIGENCE/PALETTE_LIBRARY/swiss-modernism.md). */
:root{--ground:#191919;--ink:#F2F1EE;--mute:#8E8B85;--rule:#3A3936;--plan:#F2F1EE;--done:#E8402C;--soft:#2C2B28}
:root[data-theme="light"]{--ground:#FFFFFF;--ink:#141414;--mute:#6B6863;--rule:#D9D6D0;--plan:#141414;--done:#D7261B;--soft:#F1EFEA}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent}
body{font-family:Inter,"Helvetica Neue",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body{container-type:inline-size}
.w{min-height:100%;padding:16px 4px 12px;display:grid;grid-template-columns:minmax(120px,30%) 1fr;column-gap:24px;row-gap:14px}
.rt{display:flex;flex-direction:column;gap:12px;min-width:0}
.head{display:flex;flex-direction:column;justify-content:space-between;border-top:6px solid var(--done);padding-top:10px}
.kw{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.wn{font-size:92px;font-weight:600;line-height:.82;letter-spacing:-.055em;margin-top:6px}
.rng{font-size:13px;font-weight:500;margin-top:10px}
.sum{margin-top:auto;padding-top:16px;display:grid;gap:8px}
.sum div{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--rule);padding-top:6px;font-size:12px;color:var(--mute)}
.sum b{font-size:20px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
.sum .r b{color:var(--done)}
.grid{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr));gap:3px;align-content:start;border-top:1px solid var(--ink);padding-top:8px}
.dh{font-size:11px;font-weight:600;padding-bottom:4px}
.dh.now{color:var(--done)}
.hr{font-size:10px;color:var(--mute);line-height:1;align-self:center}
.c{height:18px;border:0;padding:0;background:var(--soft);cursor:pointer;border-radius:0}
.c[data-s="1"]{background:var(--plan)}
.c[data-s="2"]{background:var(--done)}
.c:focus-visible{outline:2px solid var(--done);outline-offset:1px}
.c.today{box-shadow:inset 0 0 0 1px var(--mute)}
.c.today[data-s="1"],.c.today[data-s="2"]{box-shadow:none}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11px;color:var(--mute);align-items:center}
.key i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.note{font-size:11px;color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@container (max-width:460px){.w{grid-template-columns:1fr}.wn{font-size:64px}.head{flex-direction:row;align-items:flex-end;gap:16px}.sum{margin:0 0 0 auto;padding:0;min-width:120px}}
</style>
</head>
<body>
<div class="w" id="w">
  <div class="head">
    <div><div class="kw">Week</div><div class="wn" id="wn">00</div><div class="rng" id="rng"></div></div>
    <div class="sum" aria-live="polite">
      <div><span>Planned</span><b id="pl">0 h</b></div>
      <div class="r"><span>Done</span><b id="dn">0 h</b></div>
    </div>
  </div>
  <div class="rt">
  <div class="grid" id="g" role="group" aria-label="Deep work hours this week"></div>
  <div class="key" aria-hidden="true"><span><i style="background:var(--plan)"></i>Planned</span><span><i style="background:var(--done)"></i>Done</span><span class="note" id="note">Tap: plan, tap again: done</span></div>
  </div>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var th=q.get('theme'); if(th==='light'||th==='dark') document.documentElement.dataset.theme=th;
  else if(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.dataset.theme='light';
  function int(v,d,lo,hi){v=parseInt(v,10);return isNaN(v)?d:Math.max(lo,Math.min(hi,v))}
  var from=int(q.get('from'),8,0,22), to=int(q.get('to'),18,from+1,24);
  var demo=q.get('demo')==='1';
  var now=new Date(); now.setHours(0,0,0,0);
  var mon=new Date(now); mon.setDate(now.getDate()-((now.getDay()+6)%7));
  function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);var y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return [t.getUTCFullYear(),Math.ceil(((t-y)/864e5+1)/7)]}
  var iw=isoWeek(now), KEY='swiss-grid-v1', wk=iw[0]+'-W'+iw[1], ok=true, all={};
  try{all=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){ok=false}
  var st=(!demo&&all[wk])||{};
  if(demo){st={};[[0,9,2],[0,10,2],[0,11,2],[1,9,2],[1,10,2],[2,14,2],[2,15,2],[2,16,1],[3,9,1],[3,10,1],[4,9,1],[4,10,1],[4,11,1]].forEach(function(a){st[a[0]+':'+a[1]]=a[2]})}
  function save(){if(demo||!ok)return;all[wk]=st;var ks=Object.keys(all).sort();while(ks.length>12)delete all[ks.shift()];try{localStorage.setItem(KEY,JSON.stringify(all))}catch(e){ok=false;note()}}
  function note(){if(!ok)document.getElementById('note').textContent='Not saved: storage is blocked here'}
  document.getElementById('wn').textContent=String(iw[1]).padStart(2,'0');
  var sun=new Date(mon);sun.setDate(mon.getDate()+6);
  var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('rng').textContent=mon.getDate()+(mon.getMonth()!==sun.getMonth()?' '+M[mon.getMonth()]:'')+'–'+sun.getDate()+' '+M[sun.getMonth()]+' '+sun.getFullYear();
  var g=document.getElementById('g'), D=['M','T','W','T','F','S','S'], DL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'], ti=(now.getDay()+6)%7;
  g.appendChild(document.createElement('span'));
  D.forEach(function(d,i){var s=document.createElement('span');s.className='dh'+(i===ti?' now':'');s.textContent=d;s.setAttribute('aria-hidden','true');g.appendChild(s)});
  var S=['empty','planned','done'];
  for(var h=from;h<to;h++){
    var l=document.createElement('span');l.className='hr';l.textContent=(h%2===0||to-from<=8)?String(h).padStart(2,'0'):'';l.setAttribute('aria-hidden','true');g.appendChild(l);
    for(var d=0;d<7;d++){(function(d,h){
      var b=document.createElement('button');b.className='c'+(d===ti?' today':'');var k=d+':'+h;b.dataset.s=st[k]||0;
      function lab(){b.setAttribute('aria-label',DL[d]+' '+h+':00, '+S[st[k]||0])}
      lab();b.onclick=function(){var v=((st[k]||0)+1)%3;if(v)st[k]=v;else delete st[k];b.dataset.s=v;lab();save();sum()};
      g.appendChild(b)})(d,h)}
  }
  function sum(){var p=0,n=0;for(var k in st){if(st[k]>=1)p++;if(st[k]===2)n++}
    document.getElementById('pl').textContent=p+' h';document.getElementById('dn').textContent=n+' h'}
  sum();note();
})();
</script>
</body>
</html>
